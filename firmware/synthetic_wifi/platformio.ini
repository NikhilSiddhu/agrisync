; Board A - ESP32 WROOM-32D sensor node
;
; Flash with:
;   export WIFI_SSID='your-wifi' WIFI_PASSWORD='your-pass'
;   export PI_HOST='192.168.1.35' DEVICE_API_KEY='the-key-from-your-.env'
;   cd firmware/synthetic_wifi && pio run -t upload && pio device monitor
;
; Secrets come in as environment variables so nothing sensitive lands in git.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Stop the monitor asserting DTR/RTS. On many ESP32 boards those lines are
; wired to EN and GPIO0, and asserting them parks the chip in bootloader
; mode - which looks like garbage output at the correct baud rate.
monitor_rts = 0
monitor_dtr = 0

; LittleFS holds the store-and-forward buffer for readings that failed to send.
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit MLX90614 Library@^2.1.5
    adafruit/Adafruit ADS1X15@^2.5.0
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -DWIFI_SSID='"${sysenv.WIFI_SSID}"'
    -DWIFI_PASSWORD='"${sysenv.WIFI_PASSWORD}"'
    -DPI_HOST='"${sysenv.PI_HOST}"'
    -DDEVICE_API_KEY='"${sysenv.DEVICE_API_KEY}"'
    -DDEVICE_ID='"esp32-smoke-01"'
    -DFIRMWARE_VERSION='"1.6.0"'

    ; ── TRANSPORT ──────────────────────────────────────────────────────────
    ;   0  tethered to the Pi over USB  (bench)
    ;   1  WiFi                          (bench only, will not reach the field)
    ;   2  A7670C cellular               (the field)
    -DTRANSPORT=2

    ; Cellular. Only used when TRANSPORT=2.
    ;   APN: jionet for Jio, airtelgprs.com for Airtel
    -DCELL_APN='"${sysenv.CELL_APN}"'
    -DCELL_HOST='"ingest.agrisync.tech"'
    ; From 1.6.0 the key is written to the box's flash (NVS) by a build that
    ; has it, and kept there. Build images for the air (OTA) with it EMPTY:
    ;   DEVICE_HMAC_SECRET= pio run
    ; scripts/publish_firmware.py refuses an image that contains it.
    -DHMAC_SECRET='"${sysenv.DEVICE_HMAC_SECRET}"'
    -DCF_ACCESS_ID='"${sysenv.CF_ACCESS_ID}"'
    -DCF_ACCESS_SECRET='"${sysenv.CF_ACCESS_SECRET}"'
    ; Set to 1 to see every byte to and from the modem. Essential on first
    ; bring-up, noisy afterwards.
    -DMODEM_TRACE=0
    ; Leaf emissivity. Plant leaves sit around 0.94-0.98. The MLX90614
    ; assumes 1.0 out of the box, which biases every leaf temperature and
    ; therefore every wetness value. Measure yours if you can; 0.96 is a
    ; reasonable default for cabbage.
    -DLEAF_EMISSIVITY=0.96
    ; Optional extras - uncomment as you add hardware
    ; -DUSE_BATTERY_ADC=1
    ; A leaf wetness sensor on ADS1115 A0 (from 1.5.0). Raw millivolts go to
    ; the server, which needs LW_DRY_MV and LW_WET_MV in .env to use them.
    ; Power it from a pin so it is only energised while being read:
    ; -DLEAF_WET_SENSOR=1
    ; -DLEAF_WET_POWER_PIN=25
