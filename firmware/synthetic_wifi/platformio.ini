; Board A - ESP32 WROOM-32D sensor node
;
; Flash with:
;   export WIFI_SSID='your-wifi' WIFI_PASSWORD='your-pass'
;   export PI_HOST='192.168.1.35' DEVICE_API_KEY='the-key-from-your-.env'
;   cd firmware/synthetic_wifi && pio run -t upload && pio device monitor
;
; Secrets come in as environment variables so nothing sensitive lands in git.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; LittleFS holds the store-and-forward buffer for readings that failed to send.
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit MLX90614 Library@^2.1.5
    adafruit/Adafruit ADS1X15@^2.5.0
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -DWIFI_SSID='"${sysenv.WIFI_SSID}"'
    -DWIFI_PASSWORD='"${sysenv.WIFI_PASSWORD}"'
    -DPI_HOST='"${sysenv.PI_HOST}"'
    -DDEVICE_API_KEY='"${sysenv.DEVICE_API_KEY}"'
    -DDEVICE_ID='"esp32-smoke-01"'
    -DFIRMWARE_VERSION='"1.1.0"'
    ; Leaf emissivity. Plant leaves sit around 0.94-0.98. The MLX90614
    ; assumes 1.0 out of the box, which biases every leaf temperature and
    ; therefore every wetness value. Measure yours if you can; 0.96 is a
    ; reasonable default for cabbage.
    -DLEAF_EMISSIVITY=0.96
    ; Optional extras - uncomment as you add hardware
    ; -DUSE_BATTERY_ADC=1
    ; -DUSE_REAL_SOIL=1
