; Board B - ESP32-CAM (AI-Thinker) canopy imaging
;
; This board has NO USB port. Flash it through the FTDI programmer:
;   1. Set the FTDI voltage jumper to 5 V
;   2. FTDI 5V->5V, GND->GND, TX->U0R, RX->U0T   (TX and RX CROSS OVER)
;   3. Jumper IO0 to GND
;   4. cd firmware/esp32cam_capture && pio run -t upload
;   5. REMOVE the IO0 jumper, press RST
;
; If upload fails: IO0 not grounded, FTDI not on 5 V, or TX/RX not crossed.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200

board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCAPTURE_INTERVAL_MIN=15
